plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.prikol.snake'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.prikol.snake'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Give the generated debug APK a short, predictable filename.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "zzz.apk"
        }
    }
}
