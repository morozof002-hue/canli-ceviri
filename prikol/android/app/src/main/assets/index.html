<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>ZZZ — Neon Snake</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#080b18;--panel:#11172a;--panel2:#171f36;--line:#293454;--muted:#8e9ab8;--cyan:#43f5e8;--violet:#9d6bff;--pink:#ff4fbd;--lime:#b8ff67;--snake:#43f5e8;--glow:rgba(67,245,232,.34)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -15%,#1b2850 0%,#0b1022 42%,var(--bg) 78%);color:#f5f7ff;font-family:Inter,system-ui,sans-serif}
body{min-height:100svh;display:flex;justify-content:center;align-items:center;padding:clamp(10px,3vw,24px);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.app{width:min(100%,520px);position:relative}
header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 17px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,#43f5e8,#7765ff 62%,#ff4fbd);display:grid;place-items:center;box-shadow:0 0 28px #5d8cff55;font-size:25px}
.brand-name{font:900 22px Orbitron, sans-serif;letter-spacing:2px}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:2.8px;margin-top:3px}
.pill{font-size:10px;letter-spacing:1.4px;color:var(--cyan);border:1px solid #43f5e844;border-radius:99px;padding:8px 11px;background:#43f5e80d}
.panel{background:linear-gradient(145deg,#151d34ed,#0d1326f2);border:1px solid #344061;border-radius:26px;padding:15px;box-shadow:0 22px 70px #0008,inset 0 1px #ffffff0b;backdrop-filter:blur(16px)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{padding:10px 12px;border:1px solid #ffffff0e;border-radius:15px;background:#ffffff06;min-width:0}
.stat-label{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.stat-value{font:700 20px Orbitron,sans-serif;margin-top:4px;white-space:nowrap}
.stat-value.accent{color:var(--cyan);text-shadow:0 0 16px var(--glow)}
.arena-wrap{position:relative;border-radius:20px;padding:8px;background:linear-gradient(135deg,#43f5e822,#9d6bff22,#ff4fbd22);border:1px solid #ffffff14}
.arena{position:relative;border-radius:14px;overflow:hidden;background:#080e1d;aspect-ratio:1/1}
canvas{width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#080b18aa,#080b18d9);backdrop-filter:blur(7px);text-align:center}
.overlay.hidden{display:none}
.modal{width:100%;max-width:310px}
.eyebrow{font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:800}
.modal h1{font:800 clamp(25px,7vw,36px) Orbitron,sans-serif;line-height:1.12;margin:12px 0 9px}
.modal p{font-size:12px;line-height:1.6;color:#aab5d1;margin:0 0 19px}
.primary{width:100%;padding:15px 18px;border-radius:15px;background:linear-gradient(100deg,#39e8db,#8d71ff);color:#07101e;font-weight:900;letter-spacing:1px;box-shadow:0 8px 26px #5c8bff3d;transition:transform .15s,filter .15s}
.primary:active,.small-btn:active,.dpad button:active{transform:scale(.96);filter:brightness(1.2)}
.secondary{margin-top:9px;width:100%;padding:12px;border-radius:13px;background:#ffffff0c;border:1px solid #ffffff18;color:#d7def3;font-size:12px;font-weight:700}
.quick{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:13px 2px 0}
.quick-left{display:flex;gap:7px;flex-wrap:wrap}
.tag{font-size:10px;color:#aab5d1;padding:7px 9px;border-radius:9px;background:#ffffff08;border:1px solid #ffffff10}
.small-btn{padding:9px 11px;border-radius:11px;background:#ffffff0c;border:1px solid #ffffff18;font-size:11px;font-weight:700}
.controls{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:16px}
.dpad{display:grid;grid-template-columns:repeat(3,minmax(54px,62px));grid-template-rows:56px 56px;gap:7px;justify-content:center}
.dpad button{border:1px solid #ffffff24;background:linear-gradient(145deg,#263657,#151f39);border-radius:15px;color:#e8f1ff;font-size:24px;font-weight:800;box-shadow:0 5px 15px #0007;min-height:54px;min-width:54px;touch-action: manipulation;}
.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}
.action-stack{display:flex;flex-direction:column;gap:7px}
.action-stack button{min-width:122px;min-height:49px;padding:13px 12px;font-size:12px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.setting{border:1px solid #ffffff12;background:#ffffff06;border-radius:14px;padding:10px 12px}
.setting label{display:block;color:var(--muted);font-size:9px;letter-spacing:1.3px;margin-bottom:7px;text-transform:uppercase}
select{width:100%;border:0;outline:0;background:transparent;color:#f2f5ff;font:700 12px Inter}
select option{background:#11172a}
.footer{text-align:center;color:#65718f;font-size:9px;letter-spacing:1.8px;margin:15px 0 2px}
.toast{position:absolute;top:62px;left:50%;transform:translate(-50%,-10px);background:#17223c;border:1px solid #43f5e866;color:#c9fff9;padding:9px 14px;border-radius:99px;font-size:11px;opacity:0;pointer-events:none;transition:.25s;z-index:4;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.panel{padding:11px}.dpad{grid-template-columns:repeat(3,52px);grid-template-rows:52px 52px;gap:6px}.dpad button{font-size:22px;min-height:50px;min-width:50px}.action-stack button{min-width:104px;min-height:47px;padding:12px 9px}.stat-value{font-size:17px}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="logo">ϟ</div><div><div class="brand-name">ZZZ</div><div class="brand-sub">NEON SNAKE ARCADE</div></div></div><div class="pill">● SYSTEM ONLINE</div></header>
<section class="panel">
<div class="stats">
 <div class="stat"><div class="stat-label">Счёт</div><div class="stat-value accent" id="score">000</div></div>
 <div class="stat"><div class="stat-label">Рекорд</div><div class="stat-value" id="best">000</div></div>
 <div class="stat"><div class="stat-label">Уровень</div><div class="stat-value" id="level">01</div></div>
</div>
<div class="arena-wrap"><div class="arena"><canvas id="game" aria-label="Игровое поле ZZZ"></canvas>
<div class="overlay" id="overlay"><div class="modal"><div class="eyebrow" id="eyebrow">ARCADE EXPERIENCE</div><h1 id="overlayTitle">ГОТОВ<br>К ЗАПУСКУ?</h1><p id="overlayText">Собирай энергоядра, расти и не врезайся в собственный хвост. Твой новый рекорд начинается здесь.</p><button class="primary" id="mainAction">НАЧАТЬ ИГРУ</button><button class="secondary" id="overlaySecondary">КАК ИГРАТЬ</button></div></div></div></div>
<div class="quick"><div class="quick-left"><span class="tag" id="modeTag">РЕЖИМ: CLASSIC</span><span class="tag" id="skinTag">SKIN: CYBER</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="small-btn" id="voiceTestBtn">🐍 ПРОВЕРИТЬ ГОЛОС</button><button class="small-btn" id="soundBtn">♫ ЗВУК: ВКЛ</button></div></div>
<div class="controls">
 <div class="dpad" aria-label="Управление"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div>
 <div class="action-stack"><button class="small-btn" id="pauseBtn">Ⅱ ПАУЗА</button><button class="small-btn" id="restartBtn">↻ ЗАНОВО</button></div>
</div>
<div class="settings">
 <div class="setting"><label for="mode">Режим игры</label><select id="mode"><option value="classic">Classic</option><option value="zen">Zen — без стен</option><option value="rush">Rush — быстрее</option></select></div>
 <div class="setting"><label for="skin">Внешний вид</label><select id="skin"><option value="cyber">Cyber cyan</option><option value="plasma">Plasma violet</option><option value="toxic">Toxic lime</option><option value="sunset">Sunset pink</option></select></div>
</div>
</section>
<div class="footer">BUILT TO PLAY • MADE TO GLOW</div><div class="toast" id="toast"></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const N=24,skins={cyber:{head:'#b8fffb',body:'#43f5e8',glow:'#43f5e8'},plasma:{head:'#eadcff',body:'#9d6bff',glow:'#9d6bff'},toxic:{head:'#edffc8',body:'#b8ff67',glow:'#b8ff67'},sunset:{head:'#ffe0f4',body:'#ff4fbd',glow:'#ff4fbd'}};
let snake,dir,nextDir,food,score=0,best=0,level=1,mode='classic',skin='cyber',running=false,paused=false,dead=false,last=0,acc=0,step=125,raf=0,particles=[],soundOn=true,audio=null,foodPulse=0;
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
const storeKey=()=> 'zzz-best-'+mode;
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
new ResizeObserver(resize).observe(canvas);
function tone(freq,duration,type='sine',volume=.045){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);}catch(e){}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function snakeTalk(message){if(!soundOn)return;try{if(window.snakeVoice&&typeof window.snakeVoice.speak==='function'){window.snakeVoice.speak(message);return}if('speechSynthesis'in window&&'SpeechSynthesisUtterance'in window){const voiceLine=new SpeechSynthesisUtterance(message);voiceLine.lang='ru-RU';voiceLine.rate=1.0;voiceLine.pitch=.86;voiceLine.volume=1;window.speechSynthesis.cancel();window.speechSynthesis.speak(voiceLine)}}catch(e){toast('ОШИБКА ОЗВУЧКИ') }}
function testSnakeVoice(){if(!soundOn){toast('СНАЧАЛА ВКЛЮЧИ ЗВУК');return}try{if(window.snakeVoice&&typeof window.snakeVoice.speak==='function'){const ready=window.snakeVoice.isReady&&window.snakeVoice.isReady();const status=window.snakeVoice.getStatus?window.snakeVoice.getStatus():'Статус голоса неизвестен';window.snakeVoice.speak('Привет! Я твоя змея. Проверка голоса.');if(!ready)toast(status+' — фраза в очереди');else toast('РУССКИЙ ГОЛОС ЗАПУЩЕН');return}if('speechSynthesis'in window&&'SpeechSynthesisUtterance'in window){snakeTalk('Привет! Я твоя змея. Проверка голоса.');toast('ПРОВЕРКА ГОЛОСА');return}toast('ОЗВУЧИВАНИЕ НЕ ПОДДЕРЖИВАЕТСЯ')}}catch(e){toast('ОШИБКА: '+e.message)}}
function bestLoad(){best=Number(localStorage.getItem(storeKey())||0);$('best').textContent=String(best).padStart(3,'0')}
function updateStats(){$('score').textContent=String(score).padStart(3,'0');$('level').textContent=String(level).padStart(2,'0');$('best').textContent=String(best).padStart(3,'0')}
function reset(){cancelAnimationFrame(raf);snake=[{x:9,y:12},{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir=nextDir='right';score=0;level=1;step=mode==='rush'?82:mode==='zen'?145:125;particles=[];foodSpawn();running=false;paused=false;dead=false;acc=0;updateStats();draw();showOverlay('ARCADE EXPERIENCE','ГОТОВ<br>К ЗАПУСКУ?','Собирай энергоядра, расти и не врезайся в собственный хвост. Твой новый рекорд начинается здесь.','НАЧАТЬ ИГРУ','КАК ИГРАТЬ');$('pauseBtn').textContent='Ⅱ ПАУЗА'}
function foodSpawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
function showOverlay(kicker,title,desc,action,secondary){$('eyebrow').textContent=kicker;$('overlayTitle').innerHTML=title;$('overlayText').textContent=desc;$('mainAction').textContent=action;$('overlaySecondary').textContent=secondary;$('overlay').classList.remove('hidden')}
function hideOverlay(){$('overlay').classList.add('hidden')}
function start(){if(running)return;if(dead)reset();running=true;paused=false;hideOverlay();$('pauseBtn').textContent='Ⅱ ПАУЗА';last=performance.now();raf=requestAnimationFrame(loop);tone(520,.09,'triangle')}
function pause(){if(!running)return;running=false;paused=true;cancelAnimationFrame(raf);$('pauseBtn').textContent='▶ ПРОДОЛЖИТЬ';showOverlay('SESSION PAUSED','ПАУЗА','Твой прогресс сохранён. Когда будешь готов — продолжай.','ПРОДОЛЖИТЬ','НАЧАТЬ ЗАНОВО')}
function gameOver(){running=false;dead=true;cancelAnimationFrame(raf);snakeTalk('Это фиаско, братан');tone(190,.42,'sawtooth',.07);showOverlay('RUN COMPLETE','ИГРА<br>ОКОНЧЕНА', 'Результат: '+score+' очков. '+(score>=best?'Новый рекорд!':'Попробуешь побить рекорд?'),'ЕЩЁ РАЗ','ВЕРНУТЬСЯ В МЕНЮ')}
function turn(d){if(!dirs[d])return;const a=dirs[dir],b=dirs[d];if(a.x+b.x===0&&a.y+b.y===0)return;nextDir=d;if(!running&&!paused&&!dead)start()}
function burst(x,y,color){for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,v=25+Math.random()*100;particles.push({x:(x+.5)*canvas.clientWidth/N,y:(y+.5)*canvas.clientHeight/N,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.55,max:.55,color,size:1.5+Math.random()*3})}}
function tick(){dir=nextDir;const v=dirs[dir],h={x:snake[0].x+v.x,y:snake[0].y+v.y};
if(mode==='zen'){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
else if(h.x<0||h.x>=N||h.y<0||h.y>=N){gameOver();return}
const eating=h.x===food.x&&h.y===food.y,body=eating?snake:snake.slice(0,-1);
if(body.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return}
snake.unshift(h);
if(eating){snakeTalk('Заебца');burst(food.x,food.y,skins[skin].glow);score+=10;level=1+Math.floor(score/80);step=Math.max(mode==='rush'?54:mode==='zen'?90:65,(mode==='rush'?82:mode==='zen'?145:125)-(level-1)*5);foodSpawn();tone(650,.08,'sine');setTimeout(()=>tone(880,.1,'triangle'),55);if(score>best){best=score;localStorage.setItem(storeKey(),best)}updateStats()}else snake.pop()}
function loop(now){if(!running)return;const dt=Math.min(50,now-last);last=now;acc+=dt;while(acc>=step&&running){tick();acc-=step}updateParticles(dt/1000);foodPulse+=dt/1000;draw();if(running)raf=requestAnimationFrame(loop)}
function updateParticles(dt){particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}}
function draw(){const w=canvas.clientWidth||320,h=canvas.clientHeight||320;if(!w||!h)return;const cell=w/N;ctx.clearRect(0,0,w,h);
const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#0b1530');bg.addColorStop(1,'#080d1c');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
ctx.strokeStyle='rgba(130,160,220,.075)';ctx.lineWidth=.7;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(w,i*cell);ctx.stroke()}
const s=skins[skin],pulse=1+Math.sin(foodPulse*5)*.12,fx=(food.x+.5)*cell,fy=(food.y+.5)*cell;
ctx.save();ctx.shadowColor=s.glow;ctx.shadowBlur=24;const rg=ctx.createRadialGradient(fx,fy,1,fx,fy,cell*.48*pulse);rg.addColorStop(0,'#ffffff');rg.addColorStop(.25,s.head);rg.addColorStop(1,s.glow);ctx.fillStyle=rg;ctx.beginPath();ctx.arc(fx,fy,cell*.34*pulse,0,Math.PI*2);ctx.fill();ctx.restore();
snake.forEach((p,i)=>{const pad=i===0?1.2:1.8,x=p.x*cell+pad,y=p.y*cell+pad,size=cell-pad*2,alpha=1-i/Math.max(20,snake.length)*.42;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=s.glow;ctx.shadowBlur=i===0?19:10;const grad=ctx.createLinearGradient(x,y,x+size,y+size);grad.addColorStop(0,i===0?s.head:s.body);grad.addColorStop(1,s.body);ctx.fillStyle=grad;roundRect(x,y,size,size,cell*.28);ctx.fill();ctx.restore();if(i===0){const eyeR=cell*.075,ex=dir==='left'?[x+size*.28,x+size*.28]:dir==='right'?[x+size*.72,x+size*.72]:[x+size*.3,x+size*.7],ey=dir==='up'?[y+size*.28,y+size*.28]:dir==='down'?[y+size*.72,y+size*.72]:[y+size*.3,y+size*.3];ctx.fillStyle='#07101e';for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(ex[k],ey[k],eyeR,0,Math.PI*2);ctx.fill()}}});
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function setMode(){mode=$('mode').value;$('modeTag').textContent='РЕЖИМ: '+mode.toUpperCase();bestLoad();reset()}
function setSkin(){skin=$('skin').value;$('skinTag').textContent='SKIN: '+skin.toUpperCase();draw()}
$('mainAction').addEventListener('click',()=>{if(paused&&!dead){start();return}if(dead){reset();start();return}start()});
$('overlaySecondary').addEventListener('click',()=>{if(paused){reset();return}showOverlay('QUICK GUIDE','ПРАВИЛА<br>ПРОСТЫЕ','Управляй стрелками или свайпом. Собирай светящиеся ядра. Не сталкивайся с собой. В Zen можно проходить сквозь стены.','ПОНЯТНО','');$('overlaySecondary').style.display='none';$('mainAction').onclick=()=>{ $('overlaySecondary').style.display='block';$('mainAction').onclick=null;start() }});
$('pauseBtn').addEventListener('click',()=>{if(running)pause();else if(paused)start();else if(dead){reset()}});
$('restartBtn').addEventListener('click',()=>{reset();toast('НОВАЯ СЕССИЯ')});
$('mode').addEventListener('change',setMode);$('skin').addEventListener('change',setSkin);
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'♫ ЗВУК: ВКЛ':'♫ ЗВУК: ВЫКЛ';if(soundOn)tone(700,.1)});$('voiceTestBtn').addEventListener('click',testSnakeVoice);
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir)}));
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();turn(map[e.key])}if(e.code==='Space'){e.preventDefault();running?pause():start()}});
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>16)turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});
$('mode').value=mode;$('skin').value=skin;$('modeTag').textContent='РЕЖИМ: CLASSIC';$('skinTag').textContent='SKIN: CYBER';bestLoad();reset();
})();
</script>
</body>
</html>
