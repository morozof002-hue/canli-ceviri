function uniqueCompliment(){
 const key='zzz_masha_used_compliments_v1';
 let used=[];
 try{used=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
 const all=[];
 for(let i=0;i<mashaOpeners.length;i++)for(let j=0;j<mashaEndings.length;j++)all.push({id:i* mashaEndings.length+j,line='Машенька, '+mashaOpeners[i]+'. '+mashaEndings[j]});
 const available=all.filter(item=>!used.includes(item.id));
 if(!available.length){toast('Машенька, я уже сказала тебе все свои комплименты. Пора пополнить мой запас 💗');return null}
 const item=available[Math.floor(Math.random()*available.length)];
 used.push(item.id);
 try{localStorage.setItem(key,JSON.stringify(used))}catch(e){}
 return item.line;
}

function joke(){const line=uniqueCompliment(snakeJokes);if(line){toast(line);snakeTalk(line)}}
function testSnakeVoice(){if(!soundOn){toast('СНАЧАЛА ВКЛЮЧИ ЗВУК');return}try{if(window.snakeVoice&&typeof window.snakeVoice.speak==='function'){const ready=window.snakeVoice.isReady&&window.snakeVoice.isReady();const status=window.snakeVoice.getStatus?window.snakeVoice.getStatus():'Статус голоса неизвестен';window.snakeVoice.speak('Привет! Я твоя змея. Проверка голоса.');if(!ready){toast(status+' — открываю установку голоса');if(window.snakeVoice.installRussianVoice)window.snakeVoice.installRussianVoice()}else toast('РУССКИЙ ГОЛОС ЗАПУЩЕН');return}if('speechSynthesis'in window&&'SpeechSynthesisUtterance'in window){snakeTalk('Привет! Я твоя змея. Проверка голоса.');toast('ПРОВЕРКА ГОЛОСА');return}toast('ОЗВУЧИВАНИЕ НЕ ПОДДЕРЖИВАЕТСЯ')}catch(e){toast('ОШИБКА: '+e.message)}}
function bestLoad(){best=Number(localStorage.getItem(storeKey())||0);$('best').textContent=String(best).padStart(3,'0')}
function updateStats(){$('score').textContent=String(score).padStart(3,'0');$('level').textContent=String(level).padStart(2,'0');$('best').textContent=String(best).padStart(3,'0')}
function reset(){cancelAnimationFrame(raf);snake=[{x:9,y:12},{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir=nextDir='right';score=0;level=1;step=targetStep=mode==='rush'?82:mode==='zen'?145:125;particles=[];foodSpawn();running=false;paused=false;dead=false;acc=0;updateStats();draw();showOverlay('ARCADE EXPERIENCE','ГОТОВ<br>К ЗАПУСКУ?','Собирай энергоядра, расти и не врезайся в собственный хвост. Твой новый рекорд начинается здесь.','НАЧАТЬ ИГРУ','КАК ИГРАТЬ');$('pauseBtn').textContent='Ⅱ ПАУЗА'}
function foodSpawn(){let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p}
function showOverlay(kicker,title,desc,action,secondary){$('eyebrow').textContent=kicker;$('overlayTitle').innerHTML=title;$('overlayText').textContent=desc;$('mainAction').textContent=action;$('overlaySecondary').textContent=secondary;$('overlay').classList.remove('hidden')}
function hideOverlay(){$('overlay').classList.add('hidden')}
function start(){if(running)return;if(dead)reset();running=true;paused=false;hideOverlay();$('pauseBtn').textContent='Ⅱ ПАУЗА';last=performance.now();raf=requestAnimationFrame(loop);tone(520,.09,'triangle');if(score===0)snakeTalk('Ну что, мой чемпион? Покажи мне свою красивую игру!')}
function pause(){if(!running)return;running=false;paused=true;cancelAnimationFrame(raf);$('pauseBtn').textContent='▶ ПРОДОЛЖИТЬ';showOverlay('SESSION PAUSED','ПАУЗА','Твой прогресс сохранён. Когда будешь готов — продолжай.','ПРОДОЛЖИТЬ','НАЧАТЬ ЗАНОВО')}
function gameOver(){running=false;dead=true;cancelAnimationFrame(raf);snakeTalk('Ах, какой азарт! Не расстраивайся, мой герой. Я верю в тебя. Давай ещё раз!');tone(190,.42,'sawtooth',.07);showOverlay('ONE MORE CHANCE','НУ ЖЕ,<br>МОЙ ГЕРОЙ!','Результат: '+score+' очков. Ты всё равно великолепен. Я уже жду следующего раунда 😉','ПОКОРИТЬ МЕНЯ СНОВА','ВЕРНУТЬСЯ В МЕНЮ')}
function turn(d){if(!dirs[d])return;const a=dirs[dir],b=dirs[d];if(a.x+b.x===0&&a.y+b.y===0)return;nextDir=d;if(!running&&!paused&&!dead)start()}
function burst(x,y,color){for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,v=25+Math.random()*100;particles.push({x:(x+.5)*canvas.clientWidth/N,y:(y+.5)*canvas.clientHeight/N,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.55,max:.55,color,size:1.5+Math.random()*3})}}
function tick(){dir=nextDir;const v=dirs[dir],h={x:snake[0].x+v.x,y:snake[0].y+v.y};
if(mode==='zen'){h.x=(h.x+N)%N;h.y=(h.y+N)%N}
else if(h.x<0||h.x>=N||h.y<0||h.y>=N){gameOver();return}
const eating=h.x===food.x&&h.y===food.y,body=eating?snake:snake.slice(0,-1);
if(body.some(p=>p.x===h.x&&p.y===h.y)){gameOver();return}
snake.unshift(h);
if(eating){const line=uniqueCompliment(foodLines);if(line)snakeTalk(line);if(score>0&&((score+10)%50===0)){setTimeout(()=>{const line=uniqueCompliment(['Пятьдесят очков! Кто тут легенда?','Полтинник! Ты сегодня опасно хорош 😘']);if(line)snakeTalk(line)},500);toast('🔥 '+(score+10)+' ОЧКОВ! ТЫ МАШИНА!')}burst(food.x,food.y,skins[skin].glow);score+=10;level=1+Math.floor(score/80);targetStep=Math.max(mode==='rush'?54:mode==='zen'?90:65,(mode==='rush'?82:mode==='zen'?145:125)-score*.12);foodSpawn();tone(650,.08,'sine');setTimeout(()=>tone(880,.1,'triangle'),55);if(score>best){best=score;localStorage.setItem(storeKey(),best)}updateStats()}else snake.pop()}
function loop(now){if(!running)return;const dt=Math.min(50,now-last);last=now;step+=(targetStep-step)*Math.min(1,dt/900);acc+=dt;while(acc>=step&&running){tick();acc-=step}updateParticles(dt/1000);foodPulse+=dt/1000;draw();if(running)raf=requestAnimationFrame(loop)}
function updateParticles(dt){particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.97;p.vy*=.97}}
function draw(){const w=canvas.clientWidth||320,h=canvas.clientHeight||320;if(!w||!h)return;const cell=w/N;ctx.clearRect(0,0,w,h);
const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#0b1530');bg.addColorStop(1,'#080d1c');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
ctx.strokeStyle='rgba(130,160,220,.075)';ctx.lineWidth=.7;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(w,i*cell);ctx.stroke()}
const s=skins[skin],pulse=1+Math.sin(foodPulse*5)*.12,fx=(food.x+.5)*cell,fy=(food.y+.5)*cell;
ctx.save();ctx.shadowColor=s.glow;ctx.shadowBlur=24;const rg=ctx.createRadialGradient(fx,fy,1,fx,fy,cell*.48*pulse);rg.addColorStop(0,'#ffffff');rg.addColorStop(.25,s.head);rg.addColorStop(1,s.glow);ctx.fillStyle=rg;ctx.beginPath();ctx.arc(fx,fy,cell*.34*pulse,0,Math.PI*2);ctx.fill();ctx.restore();
snake.forEach((p,i)=>{const pad=i===0?1.2:1.8,x=p.x*cell+pad,y=p.y*cell+pad,size=cell-pad*2,alpha=1-i/Math.max(20,snake.length)*.42;ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=s.glow;ctx.shadowBlur=i===0?19:10;const grad=ctx.createLinearGradient(x,y,x+size,y+size);grad.addColorStop(0,i===0?s.head:s.body);grad.addColorStop(1,s.body);ctx.fillStyle=grad;roundRect(x,y,size,size,cell*.28);ctx.fill();
ctx.shadowBlur=0;ctx.globalAlpha=alpha*.48;const shine=ctx.createLinearGradient(x,y,x+size*.7,y+size);shine.addColorStop(0,'#ffffff');shine.addColorStop(.35,'#ffffff55');shine.addColorStop(1,'#ffffff00');ctx.fillStyle=shine;roundRect(x+1,y+1,size-2,size-2,cell*.25);ctx.fill();
ctx.globalAlpha=alpha*.32;ctx.fillStyle='#ffffff';roundRect(x+size*.16,y+size*.12,size*.62,Math.max(1,size*.12),cell*.08);ctx.fill();ctx.restore();if(i===0){const eyeR=cell*.075,ex=dir==='left'?[x+size*.28,x+size*.28]:dir==='right'?[x+size*.72,x+size*.72]:[x+size*.3,x+size*.7],ey=dir==='up'?[y+size*.28,y+size*.28]:dir==='down'?[y+size*.72,y+size*.72]:[y+size*.3,y+size*.3];ctx.fillStyle='#07101e';for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(ex[k],ey[k],eyeR,0,Math.PI*2);ctx.fill()}}});
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function setMode(){mode=$('mode').value;$('modeTag').textContent='РЕЖИМ: '+mode.toUpperCase();bestLoad();reset()}

$('mainAction').addEventListener('click',()=>{if(paused&&!dead){start();return}if(dead){reset();start();return}start()});

$('pauseBtn').addEventListener('click',()=>{if(running)pause();else if(paused)start();else if(dead){reset()}});

document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir)}));
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();turn(map[e.key])}if(e.code==='Space'){e.preventDefault();running?pause():start()}});
let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>16)turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});
$('mode').value=mode;$('skin').value=skin;$('modeTag').textContent='РЕЖИМ: CLASSIC';$('skinTag').textContent='SKIN: CYBER';bestLoad();reset();
})();
