<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#c7d3a0">
<title>Прикол — Змейка</title>
<!-- Rebuild APK: updated snake eating sound -->
<style>
:root{--lcd:#c7d3a0;--dark:#25351f;--mid:#52633e;--light:#dce5b7}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:#202820;color:var(--dark);font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px}
.machine{width:min(100%,420px);background:#d6d6c8;border:5px solid #aaa99a;border-radius:30px;padding:18px 16px 22px;box-shadow:0 16px 35px #0008,inset 0 2px 5px #fff}
.brand{display:flex;justify-content:space-between;align-items:center;margin:0 5px 12px;color:#555;font-weight:bold;letter-spacing:2px}
.brand span:last-child{font-size:11px;letter-spacing:1px}
.screen{background:var(--lcd);border:9px solid #77796d;border-radius:9px;padding:10px;box-shadow:inset 0 2px 10px #0003}
.topline{display:flex;justify-content:space-between;font: bold 13px monospace;margin:0 2px 7px}
canvas{display:block;width:100%;aspect-ratio:1/1;background:var(--lcd);image-rendering:pixelated;touch-action:none}
.status{text-align:center;min-height:24px;font:bold 13px monospace;margin-top:6px}
.actions{display:flex;gap:10px;margin:14px 4px 10px}
button{border:0;border-radius:22px;background:linear-gradient(#f4f4ec,#bdbdaf);color:#30352d;font-weight:bold;padding:12px 15px;box-shadow:0 3px 0 #8e8e82;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8e8e82}
.actions button{flex:1}
.pad{width:176px;margin:14px auto 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:48px 48px 48px;gap:5px}
.pad button{border-radius:12px;font-size:20px;padding:0}
.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
.hint{text-align:center;color:#666;font-size:11px;margin:13px 0 0}
@media(min-width:600px){.machine{transform:scale(1.02)}}
</style>
</head>
<body>
<main class="machine">
 <div class="brand"><span>NOKIA-style</span><span>ПРИКОЛ • 3310</span></div>
 <section class="screen">
  <div class="topline"><span>ЗМЕЙКА</span><span>СЧЁТ: <b id="score">0</b></span><span>РЕКОРД: <b id="best">0</b></span></div>
  <canvas id="game" width="320" height="320" aria-label="Игровое поле змейки"></canvas>
  <div class="status" id="status">НАЖМИ «СТАРТ»</div>
 </section>
 <div class="actions">
  <button id="start">СТАРТ</button><button id="pause">ПАУЗА</button><button id="restart">ЗАНОВО</button>
 </div>
 <div class="pad" aria-label="Управление">
  <button class="up" data-dir="up" aria-label="Вверх">▲</button>
  <button class="left" data-dir="left" aria-label="Влево">◀</button>
  <button class="down" data-dir="down" aria-label="Вниз">▼</button>
  <button class="right" data-dir="right" aria-label="Вправо">▶</button>
 </div>
 <p class="hint">Управление: стрелки на клавиатуре или кнопки ниже</p>
</main>
<script>
(()=>{
 const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
 const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');
 const audioCtx=window.AudioContext?new AudioContext():null;
 function playLoseSound(){
  if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
  osc.type='sawtooth';filter.type='lowpass';filter.frequency.setValueAtTime(850,now);filter.frequency.exponentialRampToValueAtTime(260,now+0.85);
  osc.frequency.setValueAtTime(430,now);osc.frequency.exponentialRampToValueAtTime(155,now+0.85);
  gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.12,now+0.08);gain.gain.setValueAtTime(0.10,now+0.48);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.9);
  osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.92);
 }

 function playEatSound(){
  if(!audioCtx)return;
  if(audioCtx.state==='suspended')audioCtx.resume();
  const now=audioCtx.currentTime;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
  osc.type='triangle';filter.type='lowpass';
  filter.frequency.setValueAtTime(520,now);filter.frequency.exponentialRampToValueAtTime(180,now+0.32);
  osc.frequency.setValueAtTime(260,now);osc.frequency.exponentialRampToValueAtTime(105,now+0.18);
  osc.frequency.setValueAtTime(145,now+0.2);osc.frequency.exponentialRampToValueAtTime(75,now+0.38);
  gain.gain.setValueAtTime(0.0001,now);gain.gain.exponentialRampToValueAtTime(0.10,now+0.035);
  gain.gain.setValueAtTime(0.07,now+0.19);gain.gain.exponentialRampToValueAtTime(0.0001,now+0.42);
  osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(now);osc.stop(now+0.44);
 }

 const N=20,CELL=16;let snake,dir,nextDir,food,score,timer,running=false,paused=false;
 let best=Number(localStorage.getItem('prikol-snake-best')||0);bestEl.textContent=best;
 const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
 function reset(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir='right';nextDir='right';score=0;scoreEl.textContent=0;placeFood();running=false;paused=false;draw();statusEl.textContent='НАЖМИ «СТАРТ»';}
 function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y));}
 function draw(){
  ctx.fillStyle='#c7d3a0';ctx.fillRect(0,0,320,320);
  ctx.strokeStyle='rgba(37,53,31,.07)';ctx.lineWidth=1;
  for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,320);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(320,i*CELL);ctx.stroke();}
  ctx.fillStyle='#25351f';ctx.fillRect(food.x*CELL+4,food.y*CELL+4,8,8);
  snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#1c2b18':'#405535';ctx.fillRect(p.x*CELL+1,p.y*CELL+1,CELL-2,CELL-2);});
  if(!running){ctx.fillStyle='rgba(199,211,160,.78)';ctx.fillRect(40,135,240,50);ctx.fillStyle='#25351f';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(paused?'ПАУЗА':'SNAKE',160,165);}
 }
 function tick(){
  dir=nextDir;const v=dirs[dir],head={x:snake[0].x+v.x,y:snake[0].y+v.y};
  const eating=head.x===food.x&&head.y===food.y;
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.slice(0,eating?snake.length:snake.length-1).some(p=>p.x===head.x&&p.y===head.y)){end();return;}
  snake.unshift(head);if(eating){playEatSound();score+=10;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('prikol-snake-best',best);}placeFood();}else snake.pop();draw();
 }
 function start(){if(running)return;if(paused){paused=false;running=true;statusEl.textContent='';draw();timer=setInterval(tick,Math.max(65,145-Math.floor(score/50)*8));return;}reset();running=true;statusEl.textContent='';draw();timer=setInterval(tick,145);}
 function end(){clearInterval(timer);running=false;paused=false;statusEl.textContent='ИГРА ОКОНЧЕНА • '+score+' ОЧКОВ';draw();playLoseSound();}
 function pause(){if(!running){if(paused)start();return;}clearInterval(timer);running=false;paused=true;statusEl.textContent='';draw();}
 function turn(d){if(!dirs[d])return;const a=dirs[dir],b=dirs[d];if(a.x+b.x===0&&a.y+b.y===0)return;nextDir=d;if(!running&&!paused)start();}
 document.getElementById('start').addEventListener('click',start);
 document.getElementById('pause').addEventListener('click',pause);
 document.getElementById('restart').addEventListener('click',reset);
 document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir);}));
 document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();turn(map[e.key]);}if(e.code==='Space'){e.preventDefault();running?pause():start();}});
 let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
 canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>18)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));},{passive:true});
 reset();
})();
</script>
</body>
</html>
