name: Android debug APK
on:
  push:
    branches: [main, lingua-ai]
  workflow_dispatch:
  schedule:
    - cron: '0 4 */5 * *'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep one debug signing key between builds so Android accepts in-place upgrades.
      - name: Restore persistent app signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lingua-ai-debug-signing-key-v1
      - name: Create signing key on first build
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=LINGUA AI, OU=Android, O=LINGUA AI, L=Unknown, ST=Unknown, C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build signed APK with monotonic version code
        run: gradle :app:assembleDebug -PVERSION_CODE=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: LINGUA-AI-update-apk
          path: app/build/outputs/apk/debug/app-debug.apk
