name: Build HUAN Translator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - huan-rebuild
      - feature/hymt2-translation
      - feature/tts-controls-stable-signing

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Prepare native dependencies
        run: bash scripts/kurulum.sh

      # Keep one debug signing key across workflow runs so Android accepts APK updates.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: huan-android-debug-signing-v1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HUAN-Translator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
