name: Build zzz APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'prikol/**'
      - '.github/workflows/build-prikol-apk.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: prikol/android
        run: gradle --no-daemon clean assembleDebug
      - name: Rename APK
        run: cp prikol/android/app/build/outputs/apk/debug/app-debug.apk prikol/android/app/build/outputs/apk/debug/zzz.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zzz
          path: prikol/android/app/build/outputs/apk/debug/zzz.apk
          if-no-files-found: error
          retention-days: 14
