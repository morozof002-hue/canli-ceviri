name: Build Neon Coast Android APK
on:
  push:
    branches:
      - vice-city-mobile
    paths:
      - 'vice-city/**'
      - '.github/workflows/vice-city-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: vice-city/android
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p release
          cp vice-city/android/app/build/outputs/apk/debug/app-debug.apk release/neon-coast.apk
      - uses: actions/upload-artifact@v4
        with:
          name: neon-coast
          path: release/neon-coast.apk
          if-no-files-found: error
          retention-days: 14
