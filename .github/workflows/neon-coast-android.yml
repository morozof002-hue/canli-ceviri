name: Build NEON COAST Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - neon-coast-unity
    paths:
      - "UnityProject/**"
      - ".github/workflows/neon-coast-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Unity Android ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          unityVersion: 6000.0.40f1
          targetPlatform: Android
          buildMethod: NeonAndroidBuild.BuildForCI
          androidAppBundle: false
          buildsPath: build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-COAST-Android-APK
          path: UnityProject/Build/Android/NEON-COAST.apk
          if-no-files-found: error
          retention-days: 14
