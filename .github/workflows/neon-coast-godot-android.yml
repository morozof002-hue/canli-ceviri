name: NEON COAST Android APK

on:
  push:
    branches: [neon-coast-godot]
    paths:
      - 'GodotProject/**'
      - '.github/workflows/neon-coast-godot-android.yml'
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java and Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y openjdk-17-jdk unzip curl
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          SDK_ROOT="${ANDROID_HOME:-/usr/lib/android-sdk}"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          command -v sdkmanager
          set +o pipefail
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"
          test -x "$SDK_ROOT/build-tools/34.0.0/apksigner"

      - name: Install Godot 4.4.1 Android export templates
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -o /tmp/godot-templates.tpz
          unzip -oj /tmp/godot-templates.tpz \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android signing and Godot SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"

      - name: Import project resources
        shell: bash
        working-directory: GodotProject
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import

      - name: Export Android APK
        shell: bash
        working-directory: GodotProject
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/NEON-COAST.apk 2>&1 | tee build/export-diagnostics.log
          test -s build/NEON-COAST.apk
          file build/NEON-COAST.apk
          unzip -t build/NEON-COAST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-COAST-Android
          path: GodotProject/build/NEON-COAST.apk
          if-no-files-found: error
          retention-days: 14
