<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101923"><title>Neon Coast — Open City</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101923;color:#fff;font-family:system-ui,Arial;touch-action:none}canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;inset:0;pointer-events:none}.panel{position:absolute;top:12px;left:12px;padding:10px 13px;border:1px solid #ffffff28;border-radius:13px;background:#07121bd9;backdrop-filter:blur(8px);font-size:13px;line-height:1.45}.mission{position:absolute;top:12px;right:12px;max-width:48%;padding:10px 12px;border-radius:13px;background:#07121bd9;border:1px solid #ffffff28;font-size:12px;text-align:right}
#controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:5px;pointer-events:auto}.act{pointer-events:auto;width:58px;height:58px;border-radius:18px;border:1px solid #ffffff55;background:#13283ddd;color:#fff;font-size:22px;font-weight:700;box-shadow:0 5px 18px #0008;touch-action:none}.act:active{background:#e05b56}.spacer{visibility:hidden}.right{display:flex;gap:9px;align-items:end;pointer-events:auto}.small{width:68px;height:68px;font-size:12px;border-radius:50%;background:#9a3c42dd}.hint{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);background:#07121bd9;padding:8px 12px;border-radius:10px;font-size:11px;color:#d6e5ef;white-space:nowrap}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="panel"><b>NEON COAST</b><br><span id="cash">$ 250</span> · <span id="mode">ПЕШКОМ</span><br><span id="wanted">Полиция: нет</span></div><div class="mission" id="mission">ЗАДАНИЕ 01<br>Найди красный спорткар</div><div class="hint" id="hint">Подойди к машине и нажми ВОЙТИ</div><div id="controls"><div class="pad"><button class="act spacer"></button><button class="act" data-key="up">▲</button><button class="act spacer"></button><button class="act" data-key="left">◀</button><button class="act" data-key="down">▼</button><button class="act" data-key="right">▶</button></div><div class="right"><button class="act small" id="enter">ВОЙТИ</button><button class="act small" id="run">БЕГ</button></div></div></div>
<script>
(()=>{
const c=document.getElementById('game'),g=c.getContext('2d'),cashEl=document.getElementById('cash'),modeEl=document.getElementById('mode'),wantedEl=document.getElementById('wanted'),missionEl=document.getElementById('mission'),hintEl=document.getElementById('hint');
let W=0,H=0,D=1;function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const world={w:2400,h:1900,roads:[{x:0,y:360,w:2400,h:150},{x:0,y:900,w:2400,h:160},{x:0,y:1450,w:2400,h:150},{x:360,y:0,w:150,h:1900},{x:1080,y:0,w:160,h:1900},{x:1800,y:0,w:150,h:1900}]};
const blocks=[];for(let y=0;y<3;y++)for(let x=0;x<3;x++){blocks.push({x:560+x*720,y:80+y*550,w:420,h:250,color:['#c77c62','#d1b178','#668b86','#9a6d81'][((x*3+y*5)%4)]})}
const player={x:430,y:430,a:0,speed:0,car:null};const cars=[{x:720,y:420,a:0,color:'#e64b4b',name:'Cheetah',owned:false},{x:1450,y:970,a:1.2,color:'#e6c45b',name:'Sentinel'},{x:2040,y:1510,a:3.1,color:'#55a8a5',name:'Banshee'}];const traffic=[];for(let i=0;i<12;i++)traffic.push({x:120+i*190,y:i%2?430:970,a:0,v:1.1+(i%3)*.4,color:['#e2d6bd','#5b8eae','#d57d50'][i%3]});
const keys={};let cash=250,wanted=0,mission=0,run=false,toast=0,last=0;
function down(k,v){keys[k]=v}document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();down(k,true)});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>down(k,false)))});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();down(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'})[e.key]||e.key,true)});addEventListener('keyup',e=>down(({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'})[e.key]||e.key,false));
document.getElementById('run').onpointerdown=()=>run=true;document.getElementById('run').onpointerup=()=>run=false;
document.getElementById('enter').onclick=()=>{if(player.car){player.x=player.car.x+38;player.y=player.car.y+30;player.car=null;modeEl.textContent='ПЕШКОМ';hintEl.textContent='Подойди к машине и нажми ВОЙТИ'}else{let car=cars.find(v=>Math.hypot(v.x-player.x,v.y-player.y)<95);if(car){player.car=car;modeEl.textContent='ЗА РУЛЁМ';hintEl.textContent='Управляй машиной. Найди жёлтую точку';if(mission===0){mission=1;missionEl.innerHTML='ЗАДАНИЕ 02<br>Доедь до доков';toast=3}}}};
const cam={x:0,y:0};function round(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function drawCar(v){g.save();g.translate(v.x,v.y);g.rotate(v.a);g.shadowColor='#0009';g.shadowBlur=10;round(-25,-13,50,26,7,v.color);round(-13,-10,24,20,5,'#263a49');g.fillStyle='#d9f1fa';g.fillRect(-10,-9,9,18);g.fillStyle='#f9e9b1';g.fillRect(18,-9,4,6);g.fillRect(18,3,4,6);g.fillStyle='#16191d';g.fillRect(-16,-16,10,4);g.fillRect(9,-16,10,4);g.fillRect(-16,12,10,4);g.fillRect(9,12,10,4);g.restore()}
function render(){g.setTransform(D,0,0,D,0,0);g.fillStyle='#1b594b';g.fillRect(0,0,W,H);g.save();g.translate(W/2-cam.x,H/2-cam.y);
for(let y=0;y<world.h;y+=90)for(let x=0;x<world.w;x+=90){g.fillStyle=((x+y)/90)%2?'#286c57':'#24644f';g.fillRect(x,y,90,90)}
world.roads.forEach(r=>{g.fillStyle='#424951';g.fillRect(r.x,r.y,r.w,r.h);g.strokeStyle='#e4d7a0';g.setLineDash([28,24]);g.lineWidth=3;g.beginPath();if(r.w>r.h){g.moveTo(r.x,r.y+r.h/2);g.lineTo(r.x+r.w,r.y+r.h/2)}else{g.moveTo(r.x+r.w/2,r.y);g.lineTo(r.x+r.w/2,r.y+r.h)}g.stroke();g.setLineDash([])});
blocks.forEach(b=>{g.fillStyle='#173c36';g.fillRect(b.x+9,b.y+13,b.w,b.h);round(b.x,b.y,b.w,b.h,8,b.color);g.fillStyle='#ffffff28';for(let x=b.x+25;x<b.x+b.w-20;x+=48)for(let y=b.y+22;y<b.y+b.h-15;y+=42)g.fillRect(x,y,22,16);g.fillStyle='#4d5d5b';g.fillRect(b.x+10,b.y+b.h-18,b.w-20,8)});
cars.forEach(drawCar);traffic.forEach(drawCar);
if(mission>0){g.fillStyle='#ffe15b';g.shadowColor='#ffe15b';g.shadowBlur=18;g.beginPath();g.arc(2130,1570,17+Math.sin(Date.now()/180)*4,0,Math.PI*2);g.fill();g.shadowBlur=0}
if(!player.car){g.save();g.translate(player.x,player.y);g.rotate(player.a);g.fillStyle='#101b2b';g.beginPath();g.ellipse(0,2,10,14,0,0,Math.PI*2);g.fill();g.fillStyle='#f0c19a';g.beginPath();g.arc(0,-10,8,0,Math.PI*2);g.fill();g.fillStyle='#f0d8aa';g.fillRect(-7,0,14,13);g.restore()}
g.restore();g.fillStyle='#ffffff10';g.fillRect(0,0,W,H)}
function update(dt){const v=player.car||player;let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let a=Math.atan2(dy,dx);if(player.car){v.a+=Math.atan2(Math.sin(a-v.a),Math.cos(a-v.a))*.12;v.speed=Math.min(7,v.speed+.16)}else{v.a=a;v.x+=dx*(run?4.1:2.5);v.y+=dy*(run?4.1:2.5)}}if(player.car){if(!dx&&!dy)v.speed*=.94;v.x+=Math.cos(v.a)*v.speed;v.y+=Math.sin(v.a)*v.speed;v.x=Math.max(20,Math.min(world.w-20,v.x));v.y=Math.max(20,Math.min(world.h-20,v.y))}
player.x=Math.max(20,Math.min(world.w-20,player.x));player.y=Math.max(20,Math.min(world.h-20,player.y));
traffic.forEach(t=>{t.x+=t.v;if(t.x>world.w+60)t.x=-60});
const target=player.car||player;cam.x+=(target.x-cam.x)*.09;cam.y+=(target.y-cam.y)*.09;
if(mission===1&&Math.hypot(target.x-2130,target.y-1570)<100){mission=2;cash+=500;cashEl.textContent='$ '+cash;missionEl.innerHTML='ЗАДАНИЕ 03<br>Доставь посылку в центр';toast=4}
wantedEl.textContent='Полиция: '+(wanted?'★'.repeat(wanted):'нет');}
function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
