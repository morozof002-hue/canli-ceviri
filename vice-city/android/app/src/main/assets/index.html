</style></head><body><canvas id="view"></canvas><div id="hud"><div class="panel"><b>NEON COAST · 3D</b><br><span id="cash">$ 250</span> · <span id="mode">ПЕШКОМ</span><br>Открытый город</div><div class="mission" id="mission">СВОБОДНЫЙ РЕЖИМ<br>Найди красную машину</div><div class="hint" id="hint">Город полностью трёхмерный · найди машину</div><div id="controls"><div class="pad"><i class="blank"></i><button class="btn" data-k="f">▲</button><i class="blank"></i><button class="btn" data-k="l">◀</button><button class="btn" data-k="b">▼</button><button class="btn" data-k="r">▶</button></div><div class="right"><button class="btn action" id="enter">ВОЙТИ</button><button class="btn action" id="sprint">БЕГ</button></div></div></div>

function matMul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}

addEventListener('keydown',e=>{let m={ArrowUp:'f',w:'f',ArrowDown:'b',s:'b',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};if(m[e.key])keys[m[e.key]]=true});addEventListener('keyup',e=>{let m={ArrowUp:'f',w:'f',ArrowDown:'b',s:'b',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};if(m[e.key])keys[m[e.key]]=false});
document.getElementById('sprint').onpointerdown=()=>running=true;document.getElementById('sprint').onpointerup=()=>running=false;
document.getElementById('enter').onclick=()=>{if(player.car){player.x=player.car.x+2;player.z=player.car.z+2;player.car=null;document.getElementById('mode').textContent='ПЕШКОМ';document.getElementById('hint').textContent='Исследуй город или найди другую машину'}else{let c=cars.find(c=>Math.hypot(c.x-player.x,c.z-player.z)<4.5);if(c){player.car=c;document.getElementById('mode').textContent='ЗА РУЛЁМ';document.getElementById('hint').textContent='Нажми ▲ чтобы ехать, ◀ ▶ чтобы рулить';document.getElementById('mission').innerHTML='СВОБОДНЫЙ РЕЖИМ<br>Исследуй трёхмерный город'}}};
function resize(){let d=Math.min(devicePixelRatio||1,1.7);canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);gl.viewport(0,0,canvas.width,canvas.height);aspect=canvas.width/canvas.height}addEventListener('resize',resize);resize();
function drawCar(c){box(c.x,.52,c.z,1.55,.48,.78,c.color,c.yaw);box(c.x,.98,c.z, .82,.43,.67,colors.glass,c.yaw);for(let side of [-1,1]){box(c.x+Math.cos(c.yaw)*.95,.2,c.z-Math.sin(c.yaw)*.95,.23,.23,.15,[.035,.04,.045,1],c.yaw);box(c.x-Math.cos(c.yaw)*.95,.2,c.z+Math.sin(c.yaw)*.95,.23,.23,.15,[.035,.04,.045,1],c.yaw)}}
function render(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;const v=player.car||player;let turn=(keys.r?1:0)-(keys.l?1:0),forward=(keys.f?1:0)-(keys.b?1:0);if(player.car){v.yaw+=turn*dt*2.1;v.speed+=(forward*13*dt);v.speed*=Math.pow(.985,dt*60);v.speed=Math.max(-4,Math.min(13,v.speed));v.x+=Math.sin(v.yaw)*v.speed*dt;v.z+=Math.cos(v.yaw)*v.speed*dt}else{player.yaw+=turn*dt*2.4;let sp=running?8:4.2;player.x+=Math.sin(player.yaw)*forward*sp*dt;player.z+=Math.cos(player.yaw)*forward*sp*dt}

if(Math.hypot(v.x-target.x,v.z-target.z)<5){cash+=500;document.getElementById('cash').textContent='$ '+cash;target={x:target.x>0?-36:36,z:target.z>0?-36:36};document.getElementById('mission').innerHTML='ЗАДАНИЕ ВЫПОЛНЕНО<br>+$500 · Следующая точка отмечена';}

document.getElementById('mode').textContent=player.car?'ЗА РУЛЁМ':'ПЕШКОМ';const dir=[Math.sin(v.yaw),0,Math.cos(v.yaw)],eye=[v.x-dir[0]*10,5.8,v.z-dir[2]*10],center=[v.x+dir[0]*2,1.2,v.z+dir[2]*2];VP=matMul(perspective(1.02,aspect,.1,180),lookAt(eye,center,[0,1,0]));

 if((Math.abs(x+z)%36)===0){
